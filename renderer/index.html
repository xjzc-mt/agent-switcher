<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';" />
  <title>AgentSwitcher</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="accounts.css">
</head>
<body>

<!-- Toast Notification Container -->
<div class="toast-box" id="toastBox" popover="manual"></div>

<!-- Unified account onboarding -->
<dialog class="password-dialog add-account-dialog" id="saveModalOverlay" aria-labelledby="addAccountTitle">
  <div class="add-dialog-header"><strong id="addAccountTitle">添加账号</strong><button class="btn-icon-ghost" type="button" data-action="closeSaveModal" aria-label="关闭添加账号">✕</button></div>
  <div class="add-account-tabs" role="tablist" aria-label="添加账号方式">
    <button type="button" role="tab" id="addTab-local" aria-controls="addPanel-local" data-add-tab="local">本地登录</button>
    <button type="button" role="tab" id="addTab-session" aria-controls="addPanel-session" data-add-tab="session">Session 导入</button>
    <button type="button" role="tab" id="addTab-backup" aria-controls="addPanel-backup" data-add-tab="backup">备份导入</button>
  </div>
  <form id="addAccountForm">
    <p class="detail-note credential-update-target" id="credentialUpdateTarget" hidden></p>
    <label class="add-platform-field" id="addPlatformField"><span>平台</span><select class="modal-input" id="modalPlatformSelect" aria-label="账号平台"><option value="codex" selected>Codex</option><option value="agy">Antigravity</option></select></label>
    <section id="addPanel-local" role="tabpanel" aria-labelledby="addTab-local" class="add-account-panel">
      <div class="add-local-account"><div><span class="input-label">检测到的账号</span><strong id="modalAccountEmail" aria-live="polite">检测中…</strong></div><button type="button" id="btnDetectLogin" class="btn btn-sm" data-action="handleModalDetect" aria-label="重新检测账号">重新检测</button></div>
      <label class="input-label" for="modalProfileInput">账号名称</label><input type="text" class="modal-input" id="modalProfileInput" maxlength="100" placeholder="例如：个人主力 / 工作账号" />
      <div class="add-login-actions">
        <button type="button" class="btn btn-brand-soft" id="btnModalLaunch" data-action="handleLaunchLogin">登录其他账号</button>
        <button type="button" class="btn login-link-copy" id="btnCopyLoginLink" data-action="privateLogin" aria-label="无痕登录" data-tooltip-instant data-tooltip="在默认浏览器的无痕窗口中登录">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5.5 11 2.3-6.5a1.3 1.3 0 0 1 1.6-.8l2.6.8 2.6-.8a1.3 1.3 0 0 1 1.6.8l2.3 6.5M3 11h18"/><circle cx="7.5" cy="17" r="2.8"/><circle cx="16.5" cy="17" r="2.8"/><path d="M10.3 16.8a2.4 2.4 0 0 1 3.4 0"/></svg>
        </button>
      </div>
      <p class="detail-note" id="localLoginHint" hidden></p>
    </section>
    <section id="addPanel-session" role="tabpanel" aria-labelledby="addTab-session" class="add-account-panel" hidden>
      <p class="detail-note" id="sessionImportHint" hidden></p>
      <textarea class="modal-input" id="sessionCredentials" aria-label="Session 凭据 JSON" placeholder="粘贴客户端凭据 JSON（单个 / 多个账号）" spellcheck="false"></textarea>
      <button type="button" class="btn btn-sm" id="btnChooseSessionFile" data-action="chooseImportFile" data-kind="credentials">选择凭据文件</button>
      <details class="session-extract-details" id="sessionExtractDetails">
        <summary class="session-extract-summary">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="extract-chevron" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
          <span class="session-extract-summary-title">对方机器如何提取凭据？查看终端指令</span>
          <span class="session-guide-file" id="sessionGuideFile" title="凭据文件路径">~/.codex/auth.json</span>
        </summary>
        <div class="session-extract-body">
          <div class="session-guide-rows">
            <div class="session-guide-row">
              <span class="session-os-badge">macOS</span>
              <code class="session-guide-code" id="sessionCmdMac" data-action="copyInstruction" data-copy-id="sessionCmdMac" title="点击直接复制">cat ~/.codex/auth.json | pbcopy</code>
              <button type="button" class="btn btn-xs btn-copy-cmd" data-action="copyInstruction" data-copy-id="sessionCmdMac" title="复制 macOS 提取指令">复制</button>
            </div>
            <div class="session-guide-row">
              <span class="session-os-badge">Windows</span>
              <code class="session-guide-code" id="sessionCmdWin" data-action="copyInstruction" data-copy-id="sessionCmdWin" title="点击直接复制">Get-Content ~\.codex\auth.json | Set-Clipboard</code>
              <button type="button" class="btn btn-xs btn-copy-cmd" data-action="copyInstruction" data-copy-id="sessionCmdWin" title="复制 Windows 提取指令">复制</button>
            </div>
            <div class="session-guide-row">
              <span class="session-os-badge">Linux</span>
              <code class="session-guide-code" id="sessionCmdLinux" data-action="copyInstruction" data-copy-id="sessionCmdLinux" title="点击直接复制">cat ~/.codex/auth.json</code>
              <button type="button" class="btn btn-xs btn-copy-cmd" data-action="copyInstruction" data-copy-id="sessionCmdLinux" title="复制 Linux 查看指令">复制</button>
            </div>
          </div>
          <div class="session-guide-hint">在对应系统终端运行后凭据已在剪贴板中，直接粘贴到上方输入框即可。</div>
        </div>
      </details>
    </section>
    <section id="addPanel-backup" role="tabpanel" aria-labelledby="addTab-backup" class="add-account-panel" hidden>
      <button type="button" class="btn" id="btnChooseBackup" data-action="chooseImportFile" data-kind="backup">选择备份文件</button>
      <span class="detail-note" id="backupFileName">支持 .ags 加密备份和 .zip 备份</span>
      <label id="backupPasswordField" hidden><span class="input-label">备份密码</span><input class="modal-input" id="backupPassword" type="password" autocomplete="current-password" aria-label="备份密码" placeholder="输入密码后解锁" /></label>
    </section>
    <div id="addImportPreview" hidden></div>
    <div class="import-error" id="addAccountError" role="alert"></div>
    <div class="modal-footer">
      <label class="add-more-option" id="addMoreOption" hidden><input id="keepAdding" type="checkbox">连续添加</label>
      <button class="btn" id="btnAddBack" type="button" data-action="closeSaveModal">取消</button>
      <button class="btn btn-primary" type="submit" id="btnConfirmSave">保存账号</button>
    </div>
  </form>
</dialog>

<!-- One window-wide drag region; every toolbar control belongs to this header. -->
<header class="workspace-topbar">
    <button class="btn-icon-ghost sidebar-toggle" id="sidebarToggle" data-action="toggleSidebar" aria-controls="appSidebar" aria-expanded="true" aria-label="收起侧边栏" title="收起侧边栏"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <div class="topbar-left">
      <div class="topbar-title" id="viewTitle">Codex 账号管理</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-sm" id="btnRefresh" data-action="loadStatus" title="刷新实时额度与状态">
        <svg id="refreshIcon" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span id="refreshLabel">刷新全部</span>
      </button>
    </div>
</header>

<!-- Left Sidebar Navigation -->
<aside class="sidebar" id="appSidebar">
  <div class="sidebar-resizer" id="sidebarResizer" title="拖拽调整侧边栏宽度" aria-hidden="true"></div>

  <nav class="sidebar-menu">
    <div class="menu-section-label">智能体</div>

    <!-- Codex Nav -->
    <button type="button" title="Codex" aria-label="Codex" class="nav-item active" id="nav-codex" data-action="selectTab" data-agent="codex">
      <div class="nav-item-left">
        <div class="nav-logo-wrap" id="logo-nav-codex"></div>
        <span class="nav-name">Codex</span>
      </div>
      <span class="nav-badge" id="badge-count-codex">0</span>
    </button>

    <!-- Antigravity Nav -->
    <button type="button" title="Antigravity" aria-label="Antigravity" class="nav-item" id="nav-agy" data-action="selectTab" data-agent="agy">
      <div class="nav-item-left">
        <div class="nav-logo-wrap" id="logo-nav-agy"></div>
        <span class="nav-name">Antigravity</span>
      </div>
      <span class="nav-badge" id="badge-count-agy">0</span>
    </button>
    <!-- Claude Nav -->
    <button type="button" aria-label="Claude Code · 暂不支持" aria-disabled="true" data-tooltip="Claude Code · 暂不支持" class="nav-item" id="nav-claude">
      <div class="nav-item-left">
        <div class="nav-logo-wrap" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#D97706">
            <path d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z" fill="currentColor"/>
          </svg>
        </div>
        <span class="nav-name">Claude</span>
      </div>
    </button>


  </nav>

  <div class="sidebar-footer" aria-label="应用工具">
    <button class="btn btn-footer sidebar-setting" id="utilitySettings" data-action="selectTab" data-agent="settings" title="设置" aria-label="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg><span id="settingsLabel">设置</span></button>

  </div>

</aside>

<!-- Right Main Workbench Area -->
<main class="main-workspace">
  <!-- Dynamic Content Container -->
  <div class="workspace-content" id="workspaceContent">
    <!-- Rendered dynamically -->
  </div>
</main>

<script src="account-policy.js"></script>
<script src="profile-name.js"></script>
<script src="tooltips.js"></script>
<script src="refresh-queue.js"></script>
<script src="layout.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
