name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - if: runner.os == 'macOS'
        run: npm test
      - if: runner.os == 'Windows'
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern="Windows|portable profile names" tests/codex-process.test.cjs tests/codex-query-identity.test.cjs tests/windows-sessions.test.cjs tests/core.test.cjs tests/credential-vault.test.cjs
